<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Record - Career Opportunity System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; }
        nav {
            background: #1a3c5e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .brand { color: white; font-size: 1.2rem; font-weight: 700; text-decoration: none; }
        nav a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 0.95rem; }
        nav a:hover { color: white; }
        .page-header {
            background: linear-gradient(135deg, #1a3c5e 0%, #2d6a9f 100%);
            color: white;
            text-align: center;
            padding: 50px 20px;
        }
        .page-header h1 { font-size: 2rem; }
        .section { max-width: 500px; margin: 50px auto; padding: 0 20px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            border-top: 4px solid #388e3c;
            margin-bottom: 24px;
        }
        .card h2 {
            font-size: 1.4rem;
            color: #1a3c5e;
            margin-bottom: 24px;
            border-left: 4px solid #2d6a9f;
            padding-left: 12px;
        }
        label { display: block; font-size: 0.9rem; color: #444; margin-bottom: 6px; font-weight: 600; }
        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #388e3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #2d6a9f; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #2d6a9f; text-decoration: none; }
        footer { text-align: center; padding: 30px; color: #999; font-size: 0.85rem; margin-top: 40px; }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="/">🏢 Career Opportunity System</a>
        <div>
            <a href="/notifications/">Notifications</a>
            <a href="/notifications/log-off/">Log Off</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>➕ Add New Record</h1>
    </div>

    <div class="section">
        <!-- Add Notification -->
        <div class="card">
            <h2>🔔 Add Notification</h2>
            <form method="POST" action="/notifications/add-record/">
                {% csrf_token %}
                <input type="hidden" name="record_type" value="notification">
                <label>Message Content:</label>
                <input type="text" name="message" required>
                <label>Sent Date:</label>
                <input type="datetime-local" name="sent_date" required>
                <button type="submit">Add Notification</button>
            </form>
        </div>

        <!-- Add Administrator -->
        <div class="card">
            <h2>👨‍💼 Add Administrator</h2>
            <form method="POST" action="/notifications/add-record/">
                {% csrf_token %}
                <input type="hidden" name="record_type" value="administrator">
                <label>Employee Number:</label>
                <input type="text" name="employee_number" required>
                <label>Department:</label>
                <input type="text" name="department" required>
                <label>Date Assigned:</label>
                <input type="date" name="date_assigned" required>
                <label>Permissions Level:</label>
                <input type="number" name="permissions_level" required>
                <button type="submit">Add Administrator</button>
            </form>
        </div>

        <a href="/notifications/" class="back-link">← Back to Notifications</a>
    </div>

    <footer>&copy; 2025 Career Opportunity System — All rights reserved.</footer>
</body>
</html>
