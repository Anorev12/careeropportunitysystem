{% extends 'application/base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 0 auto;">
  <div class="card-header">
    <h2>✏️ Edit Profile</h2>
  </div>

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label>First Name</label>
      <input type="text" name="first_name" value="{{ request.user.first_name }}">
    </div>
    <div class="form-group">
      <label>Last Name</label>
      <input type="text" name="last_name" value="{{ request.user.last_name }}">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" value="{{ request.user.email }}">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" name="phone_number" value="{{ request.user.phone_number }}">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{% url 'application:application_home' %}" class="btn btn-gray">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
