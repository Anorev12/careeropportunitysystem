<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile – Career Opportunity System</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 230px;
      min-height: 100vh;
      background: #1a3550;
      display: flex;
      flex-direction: column;
      padding: 28px 0;
      flex-shrink: 0;
    }

    .sidebar .brand {
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0 24px 28px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .sidebar .brand span {
      color: #f4a623;
    }

    .sidebar nav {
      padding: 16px 12px;
      flex: 1;
    }

    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,.7);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: .93rem;
      margin-bottom: 4px;
      transition: all .15s;
    }

    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(255,255,255,.12);
      color: #fff;
    }

    .sidebar nav a.danger {
      color: #ff8a80;
    }

    .sidebar nav a.danger:hover {
      background: rgba(255,80,80,.15);
      color: #ff5252;
    }

    .sidebar .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,.1);
      margin: 10px 12px;
    }

    .main {
      flex: 1;
      padding: 36px;
    }

    .page-header {
      margin-bottom: 28px;
    }

    .page-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a3550;
    }

    .page-header p {
      color: #7a8fa6;
      font-size: .9rem;
      margin-top: 4px;
    }

    .form-card {
      background: #fff;
      max-width: 560px;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      border-left: 4px solid #f4a623;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: .88rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #d0dce8;
      border-radius: 9px;
      background: #f7fafd;
      font-size: .92rem;
      color: #1a3550;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1a3550;
      box-shadow: 0 0 0 3px rgba(26,53,80,.1);
      background: #fff;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .btn-save {
      padding: 10px 20px;
      background: #f4a623;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-save:hover {
      background: #d4891a;
    }

    .btn-cancel {
      padding: 10px 20px;
      background: #f0f4f8;
      color: #1a3550;
      border-radius: 9px;
      font-weight: 700;
      text-decoration: none;
    }

    .btn-cancel:hover {
      background: #1a3550;
      color: #fff;
    }
  </style>
</head>

<body>

<aside class="sidebar">
  <div class="brand">Career<span>OS</span></div>

  <nav>
    <a href="{% url 'bookmarks:home' %}">🏠 Home</a>
    <a href="{% url 'bookmarks:edit_profile' %}" class="active">👤 Edit Profile</a>
    <a href="{% url 'bookmarks:add' %}">➕ Add New Record</a>
    <a href="{% url 'bookmarks:list' %}">🔖 My Records</a>

    <hr class="divider">

    <a href="{% url 'bookmarks:logout' %}" class="danger">🚪 Log Off</a>
  </nav>
</aside>

<main class="main">

  <div class="page-header">
    <h1>Edit Profile</h1>
    <p>Update your account information.</p>
  </div>

  <div class="form-card">
    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" value="{{ request.user.first_name }}">
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" value="{{ request.user.last_name }}">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" value="{{ request.user.email }}">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save">Save Changes</button>
        <a href="{% url 'bookmarks:home' %}" class="btn-cancel">Cancel</a>
      </div>
    </form>
  </div>

</main>

</body>
</html>
